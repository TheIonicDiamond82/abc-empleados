name: Keep Render Alive

on:
  schedule:
    # Se ejecuta cada 14 minutos (Render se apaga a los 15 minutos de inactividad)
    - cron: '*/14 * * * *'
  
  # Permite ejecutar la acción manualmente desde GitHub para probarla al instante
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer petición HTTP a la API
        run: |
          curl -s -o /dev/null -w "%{http_code}" http://abc-empleados-api-backend.onrender.com/api/health/db-check